<div class="status-container" [ngClass]="{'online': isOnline(), 'offline': !isOnline(), 'loading': isLoading()}">
  <div class="pulse-ring"></div>
  <div class="status-text">
    @if (isLoading()) {
      Comprobando estado...
    } @else if (isOnline()) {
      PC Encendido
      @if (latencyMs() >= 0) {
        <span class="latency" style="font-size: 0.8em; opacity: 0.8;">({{ latencyMs() }} ms)</span>
      }
    } @else {
      PC Apagado
    }
  </div>
  <div class="host-name">javipc-home.mooo.com</div>
</div>
